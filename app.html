<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="only light" />
  <title>Monetta</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- PWA: instalável e abre como app no celular -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Monetta" />
  <link rel="apple-touch-icon" href="icon-180.png" />

  <!-- Tipografia: Sora (display — títulos e números-herói) + Inter (texto e
       valores em lista, com numerais tabulares). Mesmo par da landing/login. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Único CSS linkado: ele importa todos os outros -->
  <link rel="stylesheet" href="css/index.css" />

  <!-- Aplica o tema salvo antes da página pintar, pra não dar "flash" -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("fc-theme");
        var dark = t === "dark" ||
          (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <!--
    A página tem duas áreas que se alternam:
      #auth-root  -> login / cadastro / criar empresa (quando deslogado)
      #app-shell  -> o app de verdade (quando logado)
    O js/index.js mostra uma e esconde a outra.
  -->

  <!-- ÁREA DE ENTRADA (login / onboarding) -->
  <div id="auth-root"></div>

  <!-- O APP -->
  <div id="app-shell" class="app-shell" hidden>
    <!-- Cabeçalho -->
    <header class="topbar">
      <button id="btn-menu" class="btn-menu" aria-label="Abrir menu">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="2" y1="5"  x2="18" y2="5"/>
          <line x1="2" y1="10" x2="18" y2="10"/>
          <line x1="2" y1="15" x2="18" y2="15"/>
        </svg>
      </button>
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="mg" x1="0.12" y1="0" x2="0.82" y2="1"><stop offset="0" stop-color="#C68BFF"/><stop offset="0.5" stop-color="#9A3FF0"/><stop offset="1" stop-color="#7A28DD"/></linearGradient></defs><path d="M4 15 L4 5.6 L10 13 L16 4.8 L16 15" fill="none" stroke="url(#mg)" stroke-width="2.8" stroke-linejoin="miter" stroke-linecap="butt"/></svg></span>
        <span class="brand__name">Monetta</span>
      </div>
      <span id="empresa-nome" class="topbar__empresa"></span>
      <span id="topbar-mes" class="topbar__month"></span>
      <button id="btn-tema" class="topbar__icon" aria-label="Alternar tema claro/escuro" data-tip="Tema claro/escuro"></button>
      <button id="btn-notif" class="topbar__notif" hidden aria-label="Notificações">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="notif-count" class="topbar__notif-badge"></span>
      </button>
    </header>

    <!-- Aviso de mensalidade vencendo (preenchido pelo JS só quando faz sentido) -->
    <div id="sub-banner"></div>

    <!-- Corpo: menu lateral + conteúdo -->
    <div class="body-grid">
      <!-- Menu de navegação. Cada botão tem data-tela com o nome da tela. -->
      <nav class="nav">
        <div class="nav__group">
          <span class="nav__group-label">Visão geral</span>
          <button class="nav__item is-active" data-tela="dashboard">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="5" rx="1"/></svg>
            Dashboard
          </button>
        </div>

        <div class="nav__group">
          <span class="nav__group-label">Financeiro</span>
          <button class="nav__item" data-tela="lancamentos">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5-6 5 6"/><path d="M7 14l5 6 5-6"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            Lançamentos
          </button>
          <button class="nav__item" data-tela="contas">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><path d="M9 16l2 2 4-4"/></svg>
            Contas
          </button>
          <button class="nav__item" data-tela="categorias">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
            Categorias
          </button>
          <button class="nav__item" data-tela="relatorios">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
            Relatórios
          </button>
        </div>

        <div class="nav__group">
          <span class="nav__group-label">Comercial</span>
          <button class="nav__item" data-tela="vendas">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            Vendas
          </button>
          <button class="nav__item" data-tela="estoque">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            Estoque
          </button>
          <button class="nav__item" data-tela="clientes">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Clientes
          </button>
        </div>

        <div class="nav__group">
          <span class="nav__group-label">Equipe</span>
          <button class="nav__item" data-tela="funcionarios">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="8" cy="10" r="2"/><path d="M5 16a3 3 0 0 1 6 0"/><line x1="14" y1="9" x2="19" y2="9"/><line x1="14" y1="13" x2="19" y2="13"/></svg>
            Funcionários
          </button>
        </div>

        <div class="nav__group">
          <span class="nav__group-label">Sistema</span>
          <button class="nav__item" data-tela="configuracoes">
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            Configurações
          </button>
          <button class="nav__item nav__trocar" hidden>
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            Trocar empresa
          </button>
          <button class="nav__item nav__admin" data-tela="admin" hidden>
            <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
            Admin
          </button>
        </div>

        <button id="btn-sair" class="nav__item nav__sair">
          <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sair
        </button>
      </nav>

      <!-- É aqui que cada tela é desenhada pelo JS -->
      <main id="view" class="content"></main>
    </div>

    <!-- Navegação inferior — só no mobile -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="bottom-nav__item is-active" data-tela="dashboard" aria-label="Início">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Início</span>
      </button>
      <button class="bottom-nav__item" data-tela="lancamentos" aria-label="Lançamentos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5-6 5 6"/><path d="M7 14l5 6 5-6"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        <span>Caixa</span>
      </button>
      <button class="bottom-nav__item" data-tela="contas" aria-label="Contas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><path d="M9 16l2 2 4-4"/></svg>
        <span>Contas</span>
      </button>
      <button class="bottom-nav__item" data-tela="categorias" aria-label="Categorias">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>
        <span>Categorias</span>
      </button>
      <button class="bottom-nav__item" data-tela="vendas" aria-label="Vendas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span>Vendas</span>
      </button>
      <button class="bottom-nav__item" data-tela="estoque" aria-label="Estoque">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span>Estoque</span>
      </button>
      <button class="bottom-nav__item" data-tela="clientes" aria-label="Clientes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Clientes</span>
      </button>
      <button class="bottom-nav__item" data-tela="funcionarios" aria-label="Funcionários">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="8" cy="10" r="2"/><path d="M5 16a3 3 0 0 1 6 0"/><line x1="14" y1="9" x2="19" y2="9"/><line x1="14" y1="13" x2="19" y2="13"/></svg>
        <span>Equipe</span>
      </button>
      <button class="bottom-nav__item" data-tela="relatorios" aria-label="Relatórios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
        <span>Relatórios</span>
      </button>
      <button class="bottom-nav__item" data-tela="configuracoes" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Config</span>
      </button>
      <button class="bottom-nav__item nav__admin" data-tela="admin" aria-label="Admin" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        <span>Admin</span>
      </button>
    </nav>
  </div>

  <!-- Modal reutilizável (usado pra "novo lançamento", "estornar", etc.) -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal__head">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="modal__close" aria-label="Fechar" data-tip="Fechar">×</button>
      </div>
      <div id="modal-body" class="modal__body"></div>
    </div>
  </div>

  <!-- Área dos avisos (toast) -->
  <div id="toast-area"></div>

  <!-- Único JS carregado: ele importa todos os módulos -->
  <script type="module" src="js/index.js"></script>
</body>
</html>
